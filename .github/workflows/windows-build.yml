# Сборка установщика «Мой день» для Windows.
# Windows-версию нельзя собрать на Mac, поэтому её собирает GitHub на своей Windows-машине.
# Запуск: сам при пуше в ветки stage8/** (если менялось приложение) или вручную: Actions → «Сборка для Windows» → Run workflow
# (кнопка «Run workflow» появляется, когда файл лежит в основной ветке main).
# Результат: Actions → нужный запуск → внизу «Artifacts» → moy-den-windows (внутри установщик .exe).
name: Сборка для Windows

on:
  workflow_dispatch:
  push:
    branches: ['stage8/**']
    paths:
      - '.github/workflows/windows-build.yml'
      - 'vite-project/**'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vite-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vite-project/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vite-project/src-tauri

      - run: npm ci

      # Установщик NSIS: один файл .exe, ставится без прав администратора
      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: moy-den-windows
          path: vite-project/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
